<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            width: 350px;
        }
        h1 {
            font-size: 22px;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button, .button-link {
            margin-top: 20px;
            display: inline-block;
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }
        .bmi-number {
            font-size: 40px;
            font-weight: bold;
            color: #2980b9;
        }
        .error {
            color: #c0392b;
            font-weight: bold;
        }
        ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        {% block content %}
        {% endblock %}
    </div>
    <footer style="position: fixed; bottom: 0; left: 0; width: 100%; text-align: center; font-size: 12px; color: #7f8c8d; padding: 12px 0; background: #f4f6f8;">Kwadjo Owusu-Ansah Quarshie &middot; CSE 310 &middot; Web Apps Module &middot; BYU-Pathway</footer>
</body>
</html>
