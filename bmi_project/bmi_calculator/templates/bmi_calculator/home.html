{% extends "bmi_calculator/base.html" %}

{% block content %}
    <h1>BMI Calculator</h1>
    <p>Enter your height and weight to calculate your Body Mass Index.</p>

    <!-- This form submits a GET request to the 'result' view (see urls.py). -->
    <form action="{% url 'result' %}" method="get">
        <label for="height">Height (centimeters)</label>
        <input type="number" step="0.1" id="height" name="height" required>

        <label for="weight">Weight (kilograms)</label>
        <input type="number" step="0.1" id="weight" name="weight" required>

        <button type="submit">Calculate BMI</button>
    </form>
{% endblock %}
